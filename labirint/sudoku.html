<script>
const $ = id => document.getElementById(id);

// ---------- Sudoku turlari va darajalari ----------
// br x bc = blok o'lchami (qator x ustun). 5 va 7 tub son, shuning uchun to'g'ri burchakli blok yo'q:
// ularda tasodifiy shaklli bloklar (jigsaw) ishlatiladi.
const TYPES = {
  '4':  {N:4, br:2, bc:2},
  '5':  {N:5, jig:true},
  '6':  {N:6, br:2, bc:3},
  '7':  {N:7, jig:true},
  '8':  {N:8, br:2, bc:4},
  '9':  {N:9, br:3, bc:3},
  '9x': {N:9, br:3, bc:3, diag:true}
};
// Har bir daraja uchun berilgan katakchalar soni (maqsad) va yechish usuli talabi
const LEVEL_CLUES = {'4':[11,9,7,6], '5':[16,13,11,9], '6':[24,20,17,14], '7':[32,27,23,19], '8':[40,33,28,24], '9':[42,34,29,25], '9x':[40,32,27,23]};
const LEVEL_MODE = ['naked', 'singles', 'none', 'none'];   // oson: faqat "yagona nomzod"; o'rta: + "yashirin yagona"
let typeKey = '9', levelIdx = 1;

// ---------- Tillar ----------
const I18N = {
  uz: {
    pageTitle: "Sudoku topshirig'i", tabMaze: "Labirint", tabSudoku: "Sudoku", tabWords: "So'z qidiruv", tabCross: "Krossvord",
    typeLbl: "Sudoku turi",
    types: {'4':['4×4','bloklar 2×2'], '5':['5×5','shaklli bloklar'], '6':['6×6','bloklar 2×3'], '7':['7×7','shaklli bloklar'], '8':['8×8','bloklar 2×4'], '9':['9×9','klassik'], '9x':['9×9','diagonal (X)']},
    typeFoot: {'4':'4×4', '5':'5×5 jigsaw', '6':'6×6', '7':'7×7 jigsaw', '8':'8×8', '9':'9×9', '9x':'9×9 X'},
    levelLbl: "Daraja", levels: ["Oson","O'rta","Qiyin","Juda qiyin"],
    titleLabel: "Topshiriq matni (yuqorida chiqadi)", fsLabel: "Matn o'lchami:", seedLabel: "Raqami",
    sol: "Ekranda javobni ko'rsatish",
    newBtn: "Yangi sudoku", pdfBtn: "Topshiriqni yuklab olish (PDF)", ansBtn: "Javob varag'ini yuklab olish (PDF)",
    note: "Ko'rib turganingiz PDF'da ham aynan shunday chiqadi.",
    defTitle: "Sudoku'ni yech!",
    hintClues: (c, t) => `Berilgan katakchalar: ${c} / ${t}`,
    rule: (N, jig, diag) => `Har bir qator, ustun va ${jig ? 'qalin chiziq bilan chegaralangan shaklda' : 'qalin chiziqli katakchada'} 1 dan ${N} gacha raqamlar takrorlanmasin.` + (diag ? ' Ikkala diagonalda ham.' : ''),
    foot: (n, type, level) => `Sudoku raqami: ${n} (${type}, ${level})`,
    file: n => `${n} raqamli sudoku.pdf`,
    fileAns: n => `${n} raqamli sudoku javobi.pdf`
  },
  ru: {
    pageTitle: "Задание-судоку", tabMaze: "Лабиринт", tabSudoku: "Судоку", tabWords: "Найди слова", tabCross: "Кроссворд",
    typeLbl: "Тип судоку",
    types: {'4':['4×4','блоки 2×2'], '5':['5×5','фигурные блоки'], '6':['6×6','блоки 2×3'], '7':['7×7','фигурные блоки'], '8':['8×8','блоки 2×4'], '9':['9×9','классика'], '9x':['9×9','диагональ (X)']},
    typeFoot: {'4':'4×4', '5':'5×5 jigsaw', '6':'6×6', '7':'7×7 jigsaw', '8':'8×8', '9':'9×9', '9x':'9×9 X'},
    levelLbl: "Сложность", levels: ["Легко","Средне","Сложно","Очень сложно"],
    titleLabel: "Текст задания (сверху на листе)", fsLabel: "Размер текста:", seedLabel: "Номер",
    sol: "Показать на экране ответ",
    newBtn: "Новое судоку", pdfBtn: "Скачать задание (PDF)", ansBtn: "Скачать лист с ответом (PDF)",
    note: "Именно так это будет выглядеть в PDF.",
    defTitle: "Реши судоку!",
    hintClues: (c, t) => `Заполнено клеток: ${c} из ${t}`,
    rule: (N, jig, diag) => `В каждой строке, столбце и ${jig ? 'фигуре, обведённой жирной линией,' : 'блоке с жирной границей'} цифры от 1 до ${N} не должны повторяться.` + (diag ? ' То же правило для обеих диагоналей.' : ''),
    foot: (n, type, level) => `Судоку № ${n} (${type}, ${level})`,
    file: n => `Судоку № ${n}.pdf`,
    fileAns: n => `Судоку № ${n} - ответ.pdf`
  }
};
let lang = 'uz';
const T = () => I18N[lang];

function applyLang(l, initial) {
  const defaults = Object.values(I18N).map(x => x.defTitle);
  const cur = $('title').value.trim();
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T()[el.dataset.i18n]; });
  if (defaults.includes(cur) || (initial && !cur)) $('title').value = T().defTitle;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  document.title = T().pageTitle;
  try { localStorage.setItem('lang', l); } catch (e) {}
  buildTypes(); buildLevels();
  render();
}

// ---------- Sudoku algoritmi ----------
function makeRng(a) {               // seed bilan ishlaydigan tasodifiy son generatori (mulberry32)
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rand) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

// Qoidalar: har bir "birlik" (qator, ustun, blok/shakl, diagonal) ichida raqamlar takrorlanmaydi
function assemble(t, region) {
  const N = t.N, units = [];
  for (let r = 0; r < N; r++) units.push(Array.from({length:N}, (_, c) => r*N + c));
  for (let c = 0; c < N; c++) units.push(Array.from({length:N}, (_, r) => r*N + c));
  for (let id = 0; id < N; id++) units.push(region.map((v, i) => v === id ? i : -1).filter(i => i >= 0));
  if (t.diag) {
    units.push(Array.from({length:N}, (_, i) => i*N + i));
    units.push(Array.from({length:N}, (_, i) => i*N + (N-1-i)));
  }
  const peerSets = Array.from({length:N*N}, () => new Set());
  units.forEach(u => u.forEach(a => u.forEach(b => { if (a !== b) peerSets[a].add(b); })));
  return { ...t, region, units, peers: peerSets.map(s => [...s]) };
}

// Tasodifiy shaklli bloklar: N ta bog'langan, har biri N ta katakdan iborat qism
function makeJigsaw(N, rand) {
  for (let attempt = 0; attempt < 300; attempt++) {
    const reg = Array(N*N).fill(-1), size = Array(N).fill(0);
    const perm = shuffle(Array.from({length:N}, (_, i) => i), rand);
    for (let r = 0; r < N; r++) { reg[r*N + perm[r]] = r; size[r] = 1; }
    let assigned = N;
    while (assigned < N*N) {
      const options = [];
      for (let i = 0; i < N*N; i++) {
        const k = reg[i];
        if (k < 0 || size[k] >= N) continue;
        const r = Math.floor(i / N), c = i % N;
        if (r > 0   && reg[i-N] < 0) options.push([k, i-N]);
        if (r < N-1 && reg[i+N] < 0) options.push([k, i+N]);
        if (c > 0   && reg[i-1] < 0) options.push([k, i-1]);
        if (c < N-1 && reg[i+1] < 0) options.push([k, i+1]);
      }
      if (!options.length) break;                 // tiqilib qoldi, qaytadan
      const [k, j] = options[Math.floor(rand() * options.length)];
      reg[j] = k; size[k]++; assigned++;
    }
    if (assigned === N*N) return reg;
  }
  return null;
}

const specCache = {};
function buildSpec(key, seed) {
  const t = TYPES[key], N = t.N;
  const ck = t.jig ? key + '|' + seed : key;
  if (specCache[ck]) return specCache[ck];
  let spec = null;
  if (t.jig) {
    const rand = makeRng(seed * 17 + 3);
    for (let a = 0; a < 200 && !spec; a++) {
      const reg = makeJigsaw(N, rand);
      if (!reg) continue;
      const cand = assemble(t, reg);
      if (countSolutions(cand, Array(N*N).fill(0), 1) >= 1) spec = cand;   // yechimi bor shaklni tanlaymiz
    }
    if (!spec) spec = assemble(t, Array.from({length:N*N}, (_, i) => Math.floor(i / N)));   // zaxira: qatorlar
  } else {
    spec = assemble(t, Array.from({length:N*N}, (_, i) => Math.floor(Math.floor(i / N) / t.br) * (N / t.bc) + Math.floor((i % N) / t.bc)));
  }
  return (specCache[ck] = spec);
}

const popcount = m => { let c = 0; while (m) { m &= m - 1; c++; } return c; };

// Yechimlar sonini sanaydi (limitga yetganda to'xtaydi). Eng kam nomzodli katakdan boshlaydi.
function countSolutions(spec, g, limit, rand, firstOut) {
  const full = (1 << spec.N) - 1;
  let count = 0;
  function rec() {
    let best = -1, bestMask = 0, bestCnt = 99;
    for (let i = 0; i < g.length; i++) {
      if (g[i]) continue;
      let used = 0; const ps = spec.peers[i];
      for (let k = 0; k < ps.length; k++) { const v = g[ps[k]]; if (v) used |= 1 << (v-1); }
      const m = full & ~used, c = popcount(m);
      if (c === 0) return;
      if (c < bestCnt) { bestCnt = c; best = i; bestMask = m; if (c === 1) break; }
    }
    if (best < 0) { count++; if (firstOut && count === 1) firstOut.push(...g); return; }
    const digits = [];
    for (let d = 1; d <= spec.N; d++) if (bestMask & (1 << (d-1))) digits.push(d);
    if (rand) shuffle(digits, rand);
    for (const d of digits) { g[best] = d; rec(); g[best] = 0; if (count >= limit) return; }
  }
  rec();
  return count;
}

// Faqat mantiq bilan yechiladimi? (taxminsiz): "yagona nomzod" va (ixtiyoriy) "yashirin yagona"
function solvableBySingles(spec, g0, hidden) {
  const g = g0.slice(), N = spec.N, full = (1 << N) - 1;
  const cand = i => { let used = 0; const ps = spec.peers[i]; for (let k = 0; k < ps.length; k++) { const v = g[ps[k]]; if (v) used |= 1 << (v-1); } return full & ~used; };
  let progress = true;
  while (progress) {
    progress = false;
    for (let i = 0; i < g.length; i++) {
      if (g[i]) continue;
      const m = cand(i);
      if (m === 0) return false;
      if ((m & (m - 1)) === 0) { g[i] = Math.log2(m) + 1; progress = true; }
    }
    if (!progress && hidden) {
      outer:
      for (const u of spec.units) {
        for (let d = 1; d <= N; d++) {
          if (u.some(i => g[i] === d)) continue;
          const spots = u.filter(i => !g[i] && (cand(i) & (1 << (d-1))));
          if (spots.length === 1) { g[spots[0]] = d; progress = true; break outer; }
        }
      }
    }
  }
  return g.every(v => v);
}

let puzKey = '', puzVal = null;
function generate(key, level, seed) {
  const id = `${key}|${level}|${seed}`;
  if (id === puzKey) return puzVal;
  const spec = buildSpec(key, seed), total = spec.N * spec.N;
  // 1) to'liq to'g'ri yechim
  const sol = [];
  countSolutions(spec, Array(total).fill(0), 1, makeRng(seed), sol);
  // 2) juft-juft (180° simmetrik) olib tashlab, yechim yagonaligini saqlaymiz.
  //    "Juda qiyin"da bir necha tartibni sinab, eng kam berilganli variantni tanlaymiz.
  const rand = makeRng(seed * 31 + 7);
  const target = LEVEL_CLUES[key][level], mode = LEVEL_MODE[level];
  const attempts = level === 3 ? 6 : 1;
  let bestG = null, bestClues = total + 1;
  for (let a = 0; a < attempts && bestClues > target; a++) {
    const order = shuffle(Array.from({length:total}, (_, i) => i), rand);
    const g = sol.slice();
    let clues = total;
    for (const i of order) {
      if (clues <= target) break;
      if (!g[i]) continue;
      const j = total - 1 - i;
      const cells = (i === j || !g[j]) ? [i] : [i, j];
      const backup = cells.map(c => g[c]);
      cells.forEach(c => { g[c] = 0; });
      const ok = mode === 'none' ? countSolutions(spec, g, 2) === 1 : solvableBySingles(spec, g, mode === 'singles');
      if (ok) clues -= cells.length; else cells.forEach((c, k) => { g[c] = backup[k]; });
    }
    if (clues < bestClues) { bestClues = clues; bestG = g; }
  }
  const g = bestG, clues = bestClues;
  puzKey = id;
  return (puzVal = { spec, sol, puzzle: g, clues, total });
}

// ---------- Varaqni chizish (A4 = 210 x 297 mm, k = piksel/mm) ----------
function state() {
  return {
    type: typeKey, level: levelIdx,
    seed: Math.max(1, Math.round(+$('seed').value) || 1),
    title: $('title').value,
    fontPt: +$('fs').value || 28
  };
}

function wrapLines(ctx, text, maxW) {
  if (!text.trim()) return [];
  const out = [];
  text.split('\n').forEach(par => {
    if (!par.trim()) { out.push(''); return; }
    let line = '';
    par.trim().split(/\s+/).forEach(word => {
      const t = line ? line + ' ' + word : word;
      if (!line || ctx.measureText(t).width <= maxW) line = t;
      else { out.push(line); line = word; }
    });
    out.push(line);
  });
  return out;
}

const FONT = '"Trebuchet MS","DejaVu Sans",Arial,sans-serif';

function drawSheet(canvas, k, showSolution) {
  const s = state();
  const p = generate(s.type, s.level, s.seed);
  const spec = p.spec, N = spec.N;
  const ctx = canvas.getContext('2d');
  canvas.width = Math.round(210*k);
  canvas.height = Math.round(297*k);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const M = 14, areaW = 210 - 2*M;

  // Sarlavha matni
  const fpx = s.fontPt * 0.3528 * k;
  ctx.font = `700 ${fpx}px ${FONT}`;
  ctx.fillStyle = '#1f2a44'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const lines = wrapLines(ctx, s.title, areaW*k);
  const lh = fpx * 1.25;
  lines.forEach((ln, i) => ctx.fillText(ln, 105*k, M*k + i*lh));
  const titleBottom = M + (lines.length * lh) / k;

  // Pastki yozuv
  const footH = 7;
  ctx.font = `${8*0.3528*k}px ${FONT}`;
  ctx.fillStyle = '#7b869c'; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(T().foot(s.seed, T().typeFoot[s.type], T().levels[s.level]), (210-M)*k, (297-M)*k);

  // Qoida matni (jadval tagida)
  const ruleFont = 11 * 0.3528 * k;
  ctx.font = `${ruleFont}px ${FONT}`;
  const ruleLines = wrapLines(ctx, T().rule(N, spec.jig, spec.diag), areaW*k);
  const ruleH = ruleLines.length * ruleFont * 1.35 / k;

  // Jadval o'lchami va joyi
  const top = titleBottom + (lines.length ? 8 : 0);
  const areaH = (297 - M - footH) - top;
  const cellMm = Math.min(areaW / N, 30, (areaH - ruleH - 8) / N);
  const size = cellMm * N;
  const blockH = size + 8 + ruleH;
  const gx = 105 - size/2;
  const gy = top + Math.max(0, (areaH - blockH) / 2);
  const cx = c => (gx + c*cellMm) * k, cy = r => (gy + r*cellMm) * k;

  // Diagonal (X) sudoku: diagonal kataklar och rangda
  if (spec.diag) {
    ctx.fillStyle = '#e6ecf8';
    for (let i = 0; i < N; i++) {
      ctx.fillRect(cx(i), cy(i), cellMm*k, cellMm*k);
      if (i !== N-1-i) ctx.fillRect(cx(N-1-i), cy(i), cellMm*k, cellMm*k);
    }
  }
  // Shaklli bloklar (5×5, 7×7): qo'shni bloklar turli och rangda, shunda shakllarni ko'rish oson
  if (spec.jig) {
    const PAL = ['#e8f0fc', '#fdf0dc', '#e6f5e9', '#f4e8f4', '#f0f0f0'];
    const adj = Array.from({length:N}, () => new Set());
    for (let i = 0; i < N*N; i++) {
      const r = Math.floor(i / N), c = i % N;
      if (c < N-1 && spec.region[i] !== spec.region[i+1]) { adj[spec.region[i]].add(spec.region[i+1]); adj[spec.region[i+1]].add(spec.region[i]); }
      if (r < N-1 && spec.region[i] !== spec.region[i+N]) { adj[spec.region[i]].add(spec.region[i+N]); adj[spec.region[i+N]].add(spec.region[i]); }
    }
    const col = Array(N).fill(-1);
    for (let id = 0; id < N; id++) {
      const used = new Set([...adj[id]].map(x => col[x]));
      let c = 0; while (used.has(c)) c++;
      col[id] = c;
    }
    for (let i = 0; i < N*N; i++) {
      ctx.fillStyle = PAL[col[spec.region[i]] % PAL.length];
      ctx.fillRect(cx(i % N), cy(Math.floor(i / N)), cellMm*k, cellMm*k);
    }
  }
  // Javob katakchalariga yengil fon (shaklli bloklarda qizil raqamning o'zi yetarli)
  if (showSolution && !spec.jig) {
    ctx.fillStyle = '#fdecec';
    for (let i = 0; i < N*N; i++) if (!p.puzzle[i]) ctx.fillRect(cx(i % N), cy(Math.floor(i / N)), cellMm*k, cellMm*k);
  }

  // Raqamlar
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < N*N; i++) {
    const given = p.puzzle[i], v = given || (showSolution ? p.sol[i] : 0);
    if (!v) continue;
    const x = cx(i % N) + cellMm*k/2, y = cy(Math.floor(i / N)) + cellMm*k/2;
    ctx.font = `${given ? 700 : 600} ${cellMm*0.62*k}px ${FONT}`;
    ctx.fillStyle = given ? '#1f2a44' : '#e5484d';
    ctx.fillText(String(v), x, y + cellMm*0.04*k);
  }

  // Chiziqlar: yupqa (katakchalar) va qalin (bloklar)
  ctx.strokeStyle = '#1f2a44'; ctx.lineCap = 'square';
  ctx.lineWidth = 0.3 * k;
  ctx.beginPath();
  for (let i = 0; i <= N; i++) {
    ctx.moveTo(cx(i), cy(0)); ctx.lineTo(cx(i), cy(N));
    ctx.moveTo(cx(0), cy(i)); ctx.lineTo(cx(N), cy(i));
  }
  ctx.stroke();
  ctx.lineWidth = 1.0 * k;
  ctx.beginPath();
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const i = r*N + c;
      if (c === 0 || spec.region[i-1] !== spec.region[i]) { ctx.moveTo(cx(c), cy(r)); ctx.lineTo(cx(c), cy(r+1)); }
      if (c === N-1) { ctx.moveTo(cx(N), cy(r)); ctx.lineTo(cx(N), cy(r+1)); }
      if (r === 0 || spec.region[i-N] !== spec.region[i]) { ctx.moveTo(cx(c), cy(r)); ctx.lineTo(cx(c+1), cy(r)); }
      if (r === N-1) { ctx.moveTo(cx(c), cy(N)); ctx.lineTo(cx(c+1), cy(N)); }
    }
  }
  ctx.stroke();

  // Qoida matni
  ctx.font = `${ruleFont}px ${FONT}`;
  ctx.fillStyle = '#3d4a68'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ruleLines.forEach((ln, i) => ctx.fillText(ln, 105*k, (gy + size + 8)*k + i*ruleFont*1.35));
  return p;
}

function render() {
  $('fsVal').textContent = $('fs').value;
  const p = drawSheet($('sheet'), 1240/210, $('sol').checked);   // ekran uchun (~150 dpi)
  $('clueHint').textContent = T().hintClues(p.clues, p.total);
}

// ---------- PDF (bitta A4 sahifa, JPEG rasm) ----------
function makePdf(jpeg, imgW, imgH) {
  const enc = new TextEncoder();
  const parts = [], offsets = [];
  let len = 0;
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const PW = 595.28, PH = 841.89;
  const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  push('%PDF-1.4\n');
  offsets[1] = len; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offsets[2] = len; push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  offsets[3] = len; push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
  offsets[4] = len;
  push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
  push(jpeg); push('\nendstream\nendobj\n');
  offsets[5] = len; push(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  const xref = len;
  let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function savePdf(withSolution) {
  const seed = state().seed;
  const c = document.createElement('canvas');
  drawSheet(c, 300/25.4, withSolution);           // bosma uchun 300 dpi
  c.toBlob(async blob => {
    const jpeg = new Uint8Array(await blob.arrayBuffer());
    download(makePdf(jpeg, c.width, c.height), withSolution ? T().fileAns(seed) : T().file(seed));
  }, 'image/jpeg', 0.93);
}

// ---------- Boshqaruv ----------
function buildTypes() {
  const box = $('typePick');
  box.innerHTML = '';
  Object.keys(TYPES).forEach(key => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'typ'; b.dataset.type = key;
    b.innerHTML = '<span class="big"></span><span class="sub"></span>';
    b.children[0].textContent = T().types[key][0];
    b.children[1].textContent = T().types[key][1];
    b.setAttribute('aria-pressed', String(typeKey === key));
    b.addEventListener('click', () => {
      typeKey = key;
      box.querySelectorAll('.typ').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.type === key)));
      try { localStorage.setItem('sd_type', key); } catch (e) {}
      render();
    });
    box.appendChild(b);
  });
}
function buildLevels() {
  const box = $('levelPick');
  box.innerHTML = '';
  T().levels.forEach((name, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lvl'; b.textContent = name;
    b.setAttribute('aria-pressed', String(levelIdx === i));
    b.addEventListener('click', () => {
      levelIdx = i;
      box.querySelectorAll('.lvl').forEach((x, j) => x.setAttribute('aria-pressed', String(j === i)));
      try { localStorage.setItem('sd_level', String(i)); } catch (e) {}
      render();
    });
    box.appendChild(b);
  });
}

try {
  const t = localStorage.getItem('sd_type'), l = +localStorage.getItem('sd_level');
  if (t in TYPES) typeKey = t;
  if (l >= 0 && l <= 3 && localStorage.getItem('sd_level') !== null) levelIdx = l;
} catch (e) {}

['title','fs','seed','sol'].forEach(id => $(id).addEventListener('input', render));
$('newBtn').addEventListener('click', () => { $('seed').value = Math.floor(Math.random()*1e9) + 1; render(); });
$('pdfBtn').addEventListener('click', () => savePdf(false));
$('ansBtn').addEventListener('click', () => savePdf(true));
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

$('seed').value = Math.floor(Math.random()*1e9) + 1;
let saved = 'uz';
try { saved = localStorage.getItem('lang') || 'uz'; } catch (e) {}
applyLang(I18N[saved] ? saved : 'uz', true);

// Oflayn ishlash va telefonga o'rnatish (PWA)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
