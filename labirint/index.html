<script>
const $ = id => document.getElementById(id);
const DIRS = [[0,-1],[1,0],[0,1],[-1,0]]; // shimol, sharq, janub, g'arb
const HEROES = ['🦸','🧒','👧','🐱','🐶','🐰','🦊','🐻','🐼','🐸','🤖','🚀'];
const GOALS  = ['🏁','🏠','🏰','🍎','🍯','🥕','🎁','⭐','🌳','🦴','🧀','🍦'];
let heroSt = HEROES[0], goalSt = GOALS[0], shapeKey = 'rect';
const LEVELS = [[10,14],[20,28],[35,49],[60,85]];

// ---------- Tillar ----------
const I18N = {
  uz: {
    pageTitle: "Labirint topshirig'i", tabMaze: "Labirint", tabSudoku: "Sudoku", tabWords: "So'z qidiruv", tabCross: "Krossvord",
    titleLabel: "Topshiriq matni (yuqorida chiqadi)", fsLabel: "Matn o'lchami:",
    w: "Eni", h: "Bo'yi", seedLabel: "Raqami",
    heroPick: "Qahramonni tanlang", goalPick: "Manzilni tanlang",
    levelLbl: "Qiyinlik (tez tanlash)", levels: ["Oson","O'rta","Qiyin","Juda qiyin"],
    shapeLbl: "Labirint shakli",
    shapes: {rect:"To'rtburchak", circle:"Doira", star:"Yulduz", heart:"Yurak", triangle:"Uchburchak", diamond:"Romb", house:"Uy", hexagon:"Oltiburchak"},
    hintCell: mm => `Katak o'lchami: ${mm} mm`,
    hintSmall: " · juda mayda, bosmada qiyin ko'rinishi mumkin",
    sol: "Ekranda to'g'ri yo'lni ko'rsatish",
    newBtn: "Yangi labirint", pdfBtn: "Topshiriqni yuklab olish (PDF)", ansBtn: "Javob varag'ini yuklab olish (PDF)",
    note: "Ko'rib turganingiz PDF'da ham aynan shunday chiqadi.",
    defTitle: "Qahramonga uyiga yo'l topishga yordam ber!",
    foot: (n, W, H, sh) => `Labirint raqami: ${n} (${W}×${H}${sh ? ', ' + sh : ''})`,
    file: n => `${n} raqamli labirint.pdf`,
    fileAns: n => `${n} raqamli labirint javobi.pdf`
  },
  ru: {
    pageTitle: "Задание-лабиринт", tabMaze: "Лабиринт", tabSudoku: "Судоку", tabWords: "Найди слова", tabCross: "Кроссворд",
    titleLabel: "Текст задания (сверху на листе)", fsLabel: "Размер текста:",
    w: "Ширина", h: "Высота", seedLabel: "Номер",
    heroPick: "Выберите героя", goalPick: "Выберите цель",
    levelLbl: "Сложность (быстрый выбор)", levels: ["Легко","Средне","Сложно","Очень сложно"],
    shapeLbl: "Форма лабиринта",
    shapes: {rect:"Прямоугольник", circle:"Круг", star:"Звезда", heart:"Сердце", triangle:"Треугольник", diamond:"Ромб", house:"Домик", hexagon:"Шестиугольник"},
    hintCell: mm => `Размер клетки: ${mm} мм`,
    hintSmall: " · очень мелко, при печати может быть трудно разглядеть",
    sol: "Показать на экране правильный путь",
    newBtn: "Новый лабиринт", pdfBtn: "Скачать задание (PDF)", ansBtn: "Скачать лист с ответом (PDF)",
    note: "Именно так это будет выглядеть в PDF.",
    defTitle: "Помоги герою найти дорогу домой!",
    foot: (n, W, H, sh) => `Лабиринт № ${n} (${W}×${H}${sh ? ', ' + sh : ''})`,
    file: n => `Лабиринт № ${n}.pdf`,
    fileAns: n => `Лабиринт № ${n} - ответ.pdf`
  }
};
let lang = 'uz';
const T = () => I18N[lang];

function applyLang(l, initial) {
  const defaults = Object.values(I18N).map(x => x.defTitle);
  const cur = $('title').value.trim();
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T()[el.dataset.i18n]; });
  // Matn hali o'zgartirilmagan bo'lsa (standart matn), yangi tilga o'tkazamiz
  if (defaults.includes(cur) || (initial && !cur)) $('title').value = T().defTitle;
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  document.title = T().pageTitle;
  buildLevels(); buildShapes();
  try { localStorage.setItem('lang', l); } catch (e) {}
  render();
}

// ---------- Labirint algoritmi ----------
function makeRng(a) {               // seed bilan ishlaydigan tasodifiy son generatori (mulberry32)
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Shakllar: [-1, 1] oralig'idagi ko'pburchaklar (v pastga qarab o'sadi)
function regular(n, rot) {
  return Array.from({length:n}, (_, i) => { const t = rot + i*2*Math.PI/n; return [Math.cos(t), Math.sin(t)]; });
}
function starPts() {
  const p = [];
  for (let i = 0; i < 10; i++) { const r = i % 2 ? 0.42 : 1, t = -Math.PI/2 + i*Math.PI/5; p.push([r*Math.cos(t), r*Math.sin(t)]); }
  return p;
}
function heartPts() {
  const p = [];
  for (let i = 0; i < 72; i++) {
    const t = i*2*Math.PI/72;
    p.push([16*Math.pow(Math.sin(t),3), -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))]);
  }
  const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sc = 2 / Math.max(maxX - minX, maxY - minY), cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  return p.map(([x, y]) => [(x-cx)*sc, (y-cy)*sc]);
}
const SHAPES = {
  rect: null,
  circle: regular(48, 0),
  star: starPts(),
  heart: heartPts(),
  triangle: [[0,-1],[1,0.75],[-1,0.75]],
  diamond: [[0,-1],[1,0],[0,1],[-1,0]],
  house: [[0,-1],[1,-0.15],[0.72,-0.15],[0.72,0.9],[-0.72,0.9],[-0.72,-0.15],[-1,-0.15]],
  hexagon: regular(6, Math.PI/6)
};

function inPoly(x, y, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}

// Qaysi kataklar shakl ichida ekanini aniqlaydi (eng katta bog'langan qism qoldiriladi)
function makeMask(W, H, shape) {
  const all = Array.from({length:H}, () => Array(W).fill(true));
  const poly = SHAPES[shape];
  if (!poly) return all;
  const m = Math.min(W, H) / 2;
  const inn = Array.from({length:H}, (_, y) => Array.from({length:W}, (_, x) => inPoly((x + 0.5 - W/2)/m, (y + 0.5 - H/2)/m, poly)));
  const comp = Array.from({length:H}, () => Array(W).fill(-1));
  let best = -1, bestSize = 0, id = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!inn[y][x] || comp[y][x] >= 0) continue;
    let size = 0; const q = [[x, y]]; comp[y][x] = id;
    for (let i = 0; i < q.length; i++) {
      const [cx, cy] = q[i]; size++;
      DIRS.forEach(([dx, dy]) => {
        const nx = cx+dx, ny = cy+dy;
        if (nx>=0 && ny>=0 && nx<W && ny<H && inn[ny][nx] && comp[ny][nx] < 0) { comp[ny][nx] = id; q.push([nx, ny]); }
      });
    }
    if (size > bestSize) { bestSize = size; best = id; }
    id++;
  }
  if (bestSize < 12) return all;                  // shakl juda kichik bo'lsa, oddiy to'rtburchak
  return comp.map(row => row.map(c => c === best));
}

function build(W, H, seed, shape) {
  const rand = makeRng(seed);
  const inn = makeMask(W, H, shape);
  const isIn = (x, y) => x >= 0 && y >= 0 && x < W && y < H && inn[y][x];
  const cells = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (inn[y][x]) cells.push([x, y]);
  const open = Array.from({length:H}, () => Array.from({length:W}, () => [false,false,false,false]));
  const seen = Array.from({length:H}, () => Array(W).fill(false));

  // Recursive Backtracker (DFS, stek bilan), faqat shakl ichidagi kataklarda
  const s0 = cells[Math.floor(rand()*cells.length)];
  const stack = [s0];
  seen[s0[1]][s0[0]] = true;
  while (stack.length) {
    const [x, y] = stack[stack.length-1];
    const nb = [];
    DIRS.forEach(([dx,dy], d) => { if (isIn(x+dx, y+dy) && !seen[y+dy][x+dx]) nb.push(d); });
    if (!nb.length) { stack.pop(); continue; }
    const d = nb[Math.floor(rand()*nb.length)];
    const nx = x+DIRS[d][0], ny = y+DIRS[d][1];
    open[y][x][d] = true;
    open[ny][nx][(d+2)%4] = true;
    seen[ny][nx] = true;
    stack.push([nx, ny]);
  }

  // BFS: berilgan katakdan tartib bilan hamma kataklar va yo'l
  function bfs(fx, fy) {
    const dist = Array.from({length:H}, () => Array(W).fill(-1));
    const prev = {};
    dist[fy][fx] = 0;
    const q = [[fx, fy]];
    for (let i = 0; i < q.length; i++) {
      const [x, y] = q[i];
      DIRS.forEach(([dx,dy], d) => {
        if (!open[y][x][d]) return;
        const nx = x+dx, ny = y+dy;
        if (dist[ny][nx] < 0) { dist[ny][nx] = dist[y][x]+1; prev[nx+','+ny] = [x, y]; q.push([nx, ny]); }
      });
    }
    return { q, prev };
  }

  // Kirish va chiqish labirintning chetida, shaklning eng uzoq uchlarida bo'ladi
  const isEdge = (x, y) => DIRS.some(([dx,dy]) => !isIn(x+dx, y+dy));
  const mx = cells.reduce((t, c) => t + c[0], 0) / cells.length;
  const my = cells.reduce((t, c) => t + c[1], 0) / cells.length;
  const dc = c => Math.hypot(c[0]-mx, c[1]-my);
  const edge = cells.filter(c => isEdge(c[0], c[1]));
  const maxD = Math.max(...edge.map(dc));
  const far = edge.filter(c => dc(c) >= 0.8*maxD);
  const a = far[Math.floor(rand()*far.length)];
  let e = null, bestD = -1;
  far.forEach(c => { const d = Math.hypot(c[0]-a[0], c[1]-a[1]); if (c !== a && d > bestD) { bestD = d; e = c; } });
  if (!e) e = edge.find(c => c !== a) || cells.find(c => c !== a);
  const b = bfs(a[0], a[1]);
  // Chiqish yo'nalishi: markazdan eng uzoqqa qaragan ochiq tomon
  const outDir = c => {
    let best = 0, bs = -Infinity;
    for (let d = 0; d < 4; d++) {
      if (isIn(c[0]+DIRS[d][0], c[1]+DIRS[d][1])) continue;
      const sc = DIRS[d][0]*(c[0]-mx) + DIRS[d][1]*(c[1]-my);
      if (sc > bs) { bs = sc; best = d; }
    }
    return best;
  };

  const path = [];
  for (let c = e; c; c = b.prev[c[0]+','+c[1]]) path.push(c);
  path.reverse();                    // boshidan oxirigacha

  let minX = W, maxX = 0, minY = H, maxY = 0;
  cells.forEach(([x, y]) => { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); });
  return { isIn, open, start:a, end:e, sDir:outDir(a), eDir:outDir(e), path, bbox:{minX, maxX, minY, maxY}, count:cells.length };
}

// ---------- Varaqni chizish (A4 = 210 x 297 mm, k = piksel/mm) ----------
function state() {
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v || lo));
  return {
    W: clamp(Math.round(+$('w').value), 5, 100),
    H: clamp(Math.round(+$('h').value), 5, 100),
    seed: Math.max(1, Math.round(+$('seed').value) || 1),
    shape: shapeKey,
    title: $('title').value,
    fontPt: +$('fs').value || 28
  };
}

function wrapLines(ctx, text, maxW) {
  if (!text.trim()) return [];
  const out = [];
  text.split('\n').forEach(par => {
    if (!par.trim()) { out.push(''); return; }
    let line = '';
    par.trim().split(/\s+/).forEach(word => {
      const t = line ? line + ' ' + word : word;
      if (!line || ctx.measureText(t).width <= maxW) line = t;
      else { out.push(line); line = word; }
    });
    out.push(line);
  });
  return out;
}

function drawMarker(ctx, emoji, cx, cy, size, k) {
  ctx.font = `${size*0.85*k}px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#1f2a44';
  ctx.fillText(emoji, cx*k, cy*k);
}

function drawSheet(canvas, k, showSolution) {
  const s = state();
  const m = build(s.W, s.H, s.seed, s.shape);
  const ctx = canvas.getContext('2d');
  canvas.width = Math.round(210*k);
  canvas.height = Math.round(297*k);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const M = 14;                                   // chetdan bo'sh joy, mm
  const areaW = 210 - 2*M;

  // Sarlavha matni
  const fpx = s.fontPt * 0.3528 * k;              // pt -> mm -> px
  ctx.font = `700 ${fpx}px "Trebuchet MS","DejaVu Sans",Arial,sans-serif`;
  ctx.fillStyle = '#1f2a44';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const lines = wrapLines(ctx, s.title, areaW*k);
  const lh = fpx * 1.25;
  lines.forEach((ln, i) => ctx.fillText(ln, 105*k, M*k + i*lh));
  const titleBottom = M + (lines.length * lh) / k;

  // Pastki yozuv
  const footH = 7;
  ctx.font = `${8*0.3528*k}px "Trebuchet MS","DejaVu Sans",Arial,sans-serif`;
  ctx.fillStyle = '#7b869c'; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(T().foot(s.seed, s.W, s.H, s.shape === 'rect' ? '' : T().shapes[s.shape]), (210-M)*k, (297-M)*k);

  // Labirint va stikerlar uchun maydon
  const top = titleBottom + (lines.length ? 8 : 0);
  const areaH = (297 - M - footH) - top;
  const bb = m.bbox, gw = bb.maxX - bb.minX + 1, gh = bb.maxY - bb.minY + 1;
  const cell0 = Math.min(areaW / gw, areaH / gh);
  const S = Math.min(14, Math.max(9, cell0 * 0.95));   // stiker o'lchami, mm
  const pad = [0, 0, 0, 0];                            // shimol, sharq, janub, g'arb
  pad[m.sDir] = S + 1; pad[m.eDir] = Math.max(pad[m.eDir], S + 1);
  const cell = Math.min((areaW - pad[1] - pad[3]) / gw, (areaH - pad[0] - pad[2]) / gh);
  const contentW = gw*cell + pad[1] + pad[3], contentH = gh*cell + pad[0] + pad[2];
  const ox = 105 - contentW/2 + pad[3] - bb.minX*cell;
  const oy = top + (areaH - contentH)/2 + pad[0] - bb.minY*cell;

  // Devorlar (kirish va chiqishda devor ochiq)
  const gate = (x, y, d) => (x === m.start[0] && y === m.start[1] && d === m.sDir) || (x === m.end[0] && y === m.end[1] && d === m.eDir);
  ctx.strokeStyle = '#1f2a44';
  ctx.lineWidth = Math.min(0.9, Math.max(0.3, cell*0.09)) * k;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let y = bb.minY; y <= bb.maxY; y++) {
    for (let x = bb.minX; x <= bb.maxX; x++) {
      if (!m.isIn(x, y)) continue;
      const x0 = (ox + x*cell)*k, y0 = (oy + y*cell)*k, x1 = x0 + cell*k, y1 = y0 + cell*k;
      if ((!m.isIn(x, y-1) || !m.open[y][x][0]) && !gate(x, y, 0)) { ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); }
      if ((!m.isIn(x-1, y) || !m.open[y][x][3]) && !gate(x, y, 3)) { ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); }
      if (!m.isIn(x, y+1) && !gate(x, y, 2)) { ctx.moveTo(x0, y1); ctx.lineTo(x1, y1); }
      if (!m.isIn(x+1, y) && !gate(x, y, 1)) { ctx.moveTo(x1, y0); ctx.lineTo(x1, y1); }
    }
  }
  ctx.stroke();

  // Stikerlar labirintdan tashqarida, kirish va chiqish oldida
  const ctr = ([x, y]) => [ox + (x+.5)*cell, oy + (y+.5)*cell];
  const outside = (c, d) => { const [cx, cy] = ctr(c), off = cell/2 + S/2 + 0.5; return [cx + DIRS[d][0]*off, cy + DIRS[d][1]*off]; };
  const sp = outside(m.start, m.sDir), ep = outside(m.end, m.eDir);

  // To'g'ri yo'l (javob varag'i)
  if (showSolution) {
    ctx.strokeStyle = 'rgba(229,72,77,.85)';
    ctx.lineWidth = Math.min(2, Math.max(0.5, cell * 0.22)) * k;
    ctx.beginPath();
    [sp, ...m.path.map(ctr), ep].forEach(([px, py], i) => {
      i ? ctx.lineTo(px*k, py*k) : ctx.moveTo(px*k, py*k);
    });
    ctx.stroke();
  }

  drawMarker(ctx, heroSt, sp[0], sp[1], S, k);
  drawMarker(ctx, goalSt, ep[0], ep[1], S, k);
  return { cell, S };
}

function render() {
  $('fsVal').textContent = $('fs').value;
  const info = drawSheet($('sheet'), 1240/210, $('sol').checked);   // ekran uchun (~150 dpi)
  const h = $('cellHint');
  h.textContent = T().hintCell(info.cell.toFixed(1)) + (info.cell < 3 ? T().hintSmall : '');
  h.classList.toggle('warn', info.cell < 3);
}

// ---------- PDF (bitta A4 sahifa, JPEG rasm) ----------
function makePdf(jpeg, imgW, imgH) {
  const enc = new TextEncoder();
  const parts = [], offsets = [];
  let len = 0;
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); len += b.length; };
  const PW = 595.28, PH = 841.89;               // A4, pt
  const content = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;

  push('%PDF-1.4\n');
  offsets[1] = len; push('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offsets[2] = len; push('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  offsets[3] = len; push(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
  offsets[4] = len;
  push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
  push(jpeg); push('\nendstream\nendobj\n');
  offsets[5] = len; push(`5 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  const xref = len;
  let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, { type: 'application/pdf' });
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function savePdf(withSolution) {
  const seed = state().seed;
  const c = document.createElement('canvas');
  drawSheet(c, 300/25.4, withSolution);           // bosma uchun 300 dpi
  c.toBlob(async blob => {
    const jpeg = new Uint8Array(await blob.arrayBuffer());
    const pdf = makePdf(jpeg, c.width, c.height);
    download(pdf, withSolution ? T().fileAns(seed) : T().file(seed));
  }, 'image/jpeg', 0.93);
}

// ---------- Boshqaruv ----------
function buildLevels() {
  const box = $('levels');
  box.innerHTML = '';
  LEVELS.forEach(([w, h], i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lvl'; b.textContent = T().levels[i];
    b.title = `${w}×${h}`;
    b.addEventListener('click', () => { $('w').value = w; $('h').value = h; render(); });
    box.appendChild(b);
  });
}
function shapeIcon(key) {
  const pts = SHAPES[key] || [[-0.75,-0.95],[0.75,-0.95],[0.75,0.95],[-0.75,0.95]];
  const p = pts.map(([x, y]) => `${(15 + x*13).toFixed(1)},${(15 + y*13).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 30 30" aria-hidden="true"><polygon points="${p}" fill="#2F6FED" opacity=".9"/></svg>`;
}
function buildShapes() {
  const box = $('shapePick');
  box.innerHTML = '';
  Object.keys(SHAPES).forEach(key => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'shp'; b.dataset.shape = key;
    b.innerHTML = shapeIcon(key) + '<span></span>';
    b.lastChild.textContent = T().shapes[key];
    b.setAttribute('aria-pressed', String(shapeKey === key));
    b.addEventListener('click', () => {
      shapeKey = key;
      box.querySelectorAll('.shp').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.shape === key)));
      try { localStorage.setItem('shape', key); } catch (e) {}
      render();
    });
    box.appendChild(b);
  });
}
function buildPicker(boxId, list, get, set, storeKey) {
  const box = $(boxId);
  box.innerHTML = '';
  list.forEach(em => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'stk'; b.textContent = em; b.setAttribute('aria-label', em);
    b.setAttribute('aria-pressed', String(get() === em));
    b.addEventListener('click', () => {
      set(em);
      box.querySelectorAll('.stk').forEach(x => x.setAttribute('aria-pressed', String(x.textContent === em)));
      try { localStorage.setItem(storeKey, em); } catch (e) {}
      render();
    });
    box.appendChild(b);
  });
}
try {
  const h = localStorage.getItem('hero'), g = localStorage.getItem('goal');
  if (HEROES.includes(h)) heroSt = h;
  if (GOALS.includes(g)) goalSt = g;
  const sh = localStorage.getItem('shape');
  if (sh in SHAPES) shapeKey = sh;
} catch (e) {}
buildPicker('heroPick', HEROES, () => heroSt, v => heroSt = v, 'hero');
buildPicker('goalPick', GOALS,  () => goalSt, v => goalSt = v, 'goal');
['title','fs','w','h','seed','sol'].forEach(id => $(id).addEventListener('input', render));
$('newBtn').addEventListener('click', () => {
  $('seed').value = Math.floor(Math.random()*1e9) + 1;
  render();
});
$('pdfBtn').addEventListener('click', () => savePdf(false));
$('ansBtn').addEventListener('click', () => savePdf(true));

document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

$('seed').value = Math.floor(Math.random()*1e9) + 1;
let saved = 'uz';
try { saved = localStorage.getItem('lang') || 'uz'; } catch (e) {}
applyLang(I18N[saved] ? saved : 'uz', true);

// Oflayn ishlash va telefonga o'rnatish (PWA)
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
